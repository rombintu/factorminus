[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factorminus"
version = "0.1.0"
description = "Фактор-минус: плашка о том, как покупка ляжет в портфель"
requires-python = ">=3.12"
license = { file = "LICENSE" }
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "typer>=0.12",
  "pyyaml>=6",
  # Потоки numpy.random.Generator не обещают стабильность между мажорными версиями:
  # фикстуры синтетики сверяются тестом, при смене версии их надо перегенерировать.
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
ml = ["laya==0.5.1"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
fm = "factorminus.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
factorminus = ["db/migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: требует сети и реального токена (make test-live)"]
