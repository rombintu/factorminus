[project]
name = "factorminus"
version = "0.1.1"
description = "Фактор-минус: плашка о ложной диверсификации при покупке бумаги"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx==0.28.1", "pydantic==2.12.5", "numpy==2.3.5", "certifi==2025.11.12"]

[project.scripts]
fm = "factorminus.cli:main"

[dependency-groups]
dev = ["pytest==9.0.1", "ruff==0.14.6"]

[build-system]
requires = ["hatchling==1.28.0"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not live'"
markers = ["live: ходит в песочницу MCP, нужен токен"]

[tool.ruff]
line-length = 100
