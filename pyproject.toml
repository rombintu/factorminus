[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "factorminus"
version = "0.1.0"
description = "Фактор-минус: плашка о том, как покупка ляжет в портфель"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.6",
  "typer>=0.12",
  "pyyaml>=6",
  # Потоки numpy.random.Generator не обещают стабильность между мажорными версиями:
  # фикстуры синтетики сверяются тестом, при смене версии их надо перегенерировать.
  "numpy>=1.26,<3",
]

[project.optional-dependencies]
# torch указан явно, чтобы на Linux брать CPU-сборку (см. [tool.uv.sources]): иначе образ
# потянет CUDA на несколько гигабайт.
ml = ["laya==0.5.1", "torch>=2.6"]
dev = [
  "pytest>=8",
  "ruff>=0.6",
  "pytest-cov>=5",
  "pre-commit>=4",
  "pip-audit>=2.7",
  "uv>=0.5",
]

[project.scripts]
fm = "factorminus.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
factorminus = ["db/migrations/*.sql"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
markers = [
  "live: требует сети и реального токена (make test-live)",
  "ml: требует laya и весов модели (make test-ml, образ runtime-ml)",
  "ml_heavy: ML-тест, которому мало 4 ГБ памяти (preload всех моделей laya); только --ml-heavy",
  "git: читает git ls-files; без git-репозитория (образ test) пропускается",
]

# Lock-файлы requirements/*.txt: make lock (uv pip compile). Только инструмент компиляции,
# ставятся они обычным pip.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
