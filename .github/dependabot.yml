# Обновления зависимостей раз в неделю; мелкие (minor, patch) — одним PR на экосистему.
# Каждый PR проходит обычный CI: lockfiles проверяет, что lock-файлы согласованы с pyproject.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      python-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-base:
        update-types: [minor, patch]
