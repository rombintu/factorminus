# Обновления раз в неделю; мелкие (minor, patch) — одним PR на экосистему.
# Python-зависимостей здесь нет: lock-файлы requirements/*.txt собирает `uv pip compile`
# с хэшами и индексом torch CPU, а Dependabot правил бы каждый файл отдельно и разводил
# их с pyproject.toml. Обновление: `make lock-upgrade` → PR (docs/CI.md). Уязвимости
# в закреплённых версиях видны без PR: workflow audit.yml раз в неделю.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        update-types: [minor, patch]

  # базовый образ в FROM Dockerfile (литерально, с digest)
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      docker-base:
        update-types: [minor, patch]
