# Аудит закреплённых версий (pip-audit по base, dev, ml): на PR, меняющих зависимости,
# и раз в неделю, чтобы новые уязвимости были видны без PR. Исключения с причиной:
# .github/pip-audit-ignore.txt. Merge не блокирует (не входит в обязательные проверки).
name: audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ["requirements/**", "pyproject.toml"]
  schedule:
    - cron: "0 4 * * 1" # понедельник, 04:00 UTC

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: make install-deps
      - run: make audit
