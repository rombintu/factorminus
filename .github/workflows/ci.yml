# CI: каждая проверка — цель Makefile, YAML только оркестрирует. Схема: docs/CI.md.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # release.yml (только теги vX.Y.Z) вызывает этот workflow и публикует образ после его успеха
  workflow_call:

permissions:
  contents: read

concurrency:
  # при вызове из release.yml github.workflow = "release": отдельная группа, без взаимной отмены
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # из release.yml прогон не отменяется: иначе тег остался бы без релиза
  cancel-in-progress: ${{ github.workflow == 'ci' }}

env:
  PY: python
  FM: fm

defaults:
  run:
    shell: bash # -eo pipefail: падение до `| tee` не теряется

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: make install-deps
      - run: make lint
      # actionlint по .github/workflows/, hadolint по Dockerfile (контейнеры закреплены по digest)
      - run: make lint-docker

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: make install-deps
      # офлайн: conftest блокирует сокеты; live- и ML-тесты пропускаются
      - run: mkdir -p build && make test-cov 2>&1 | tee build/test.log
      - if: always()
        run: grep -E 'Total coverage|passed|failed' build/test.log >> "$GITHUB_STEP_SUMMARY" || true

  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks проверяет всю историю
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: make hygiene
      - run: make gitleaks

  lockfiles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: make install-deps
      - run: make lock-check

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: make install-deps
      - run: make contract-check

  docker:
    runs-on: ubuntu-24.04
    env:
      IMAGE: factorminus
      TAG: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
      - name: build runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          tags: factorminus:ci
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: build test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          load: true
          tags: factorminus:test
          cache-from: |
            type=gha,scope=runtime
            type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test
      - run: make docker-test-run
      # smoke: демо на синтетике без .env и без токена
      - run: make docker-demo
      - run: make -s docker-check 2>&1 | sed "s/^/- /" | tee -a "$GITHUB_STEP_SUMMARY"

  # Не блокирует merge, пока не разберёмся с ложными срабатываниями.
  # Исключения с причиной: .github/pip-audit-ignore.txt
  audit:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: make install-deps
      - run: make audit
