# CI: каждая проверка — цель Makefile, YAML только оркестрирует. Схема: docs/CI.md.
name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  # release.yml вызывает этот workflow и публикует образы только после его успеха
  workflow_call:

permissions:
  contents: read

concurrency:
  # при вызове из release.yml github.workflow = "release": отдельная группа, без взаимной отмены
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PY: python
  FM: fm

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: make install-deps
      - run: make lint
      # actionlint по .github/workflows/, hadolint по Dockerfile (контейнеры закреплены по digest)
      - run: make lint-docker

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: make install-deps
      # офлайн: conftest блокирует сокеты; live- и ML-тесты пропускаются
      - run: make test-cov
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-test
          path: |
            build/junit.xml
            build/coverage.xml
          if-no-files-found: ignore
          retention-days: 14

  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks проверяет всю историю
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: make hygiene
      - run: make gitleaks
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-hygiene
          path: build/ci/
          if-no-files-found: ignore
          retention-days: 14

  lockfiles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: make install-deps
      - run: make lock-check

  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: make install-deps
      - run: make contract-check

  docker:
    runs-on: ubuntu-24.04
    env:
      IMAGE: factorminus
      TAG: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: start build timer
        run: mkdir -p build/ci && date +%s > build/ci/.t0
      - name: build runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          tags: factorminus:ci
          build-args: |
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,mode=max,scope=runtime
      - name: stop build timer
        run: echo $(( $(date +%s) - $(cat build/ci/.t0) )) > build/ci/build-runtime.txt && rm build/ci/.t0
      - name: build test
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test
          load: true
          tags: factorminus:test
          cache-from: |
            type=gha,scope=runtime
            type=gha,scope=test
          cache-to: type=gha,mode=max,scope=test
      - run: make docker-test-run
      # smoke: демо на синтетике без .env и без токена
      - run: make docker-demo
      - run: make docker-check
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-docker
          path: build/ci/
          if-no-files-found: ignore
          retention-days: 14

  # Не блокирует merge, пока не разберёмся с ложными срабатываниями.
  # Исключения с причиной: .github/pip-audit-ignore.txt
  audit:
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: make install-deps
      - run: make audit

  summary:
    if: always()
    needs: [lint, test, hygiene, lockfiles, contract, docker, audit]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ci-*
          path: build-artifacts
      - name: collect
        run: |
          mkdir -p build/ci
          cp build-artifacts/ci-test/*.xml build/ 2>/dev/null || true
          cp build-artifacts/ci-hygiene/* build-artifacts/ci-docker/* build/ci/ 2>/dev/null || true
      - run: make ci-summary
      - name: jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          {
            echo "### Задачи"
            echo
            echo "$RESULTS" | jq -r 'to_entries[] | "- \(.key): \(.value.result)"'
          } >> "$GITHUB_STEP_SUMMARY"
