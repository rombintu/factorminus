# ML: сборка runtime-ml (laya, torch CPU, веса в образе) и ML smoke без сети.
# В merge не блокирует (не входит в обязательные проверки). Схема: docs/CI.md.
name: ml

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * 1" # понедельник, 03:00 UTC
  pull_request:
    branches: [main]
    paths:
      - "src/factorminus/analysis/labeler*"
      - "requirements/ml.txt"
      - "Dockerfile"

permissions:
  contents: read

defaults:
  run:
    shell: bash # -eo pipefail: падение до `| tee` не теряется

concurrency:
  group: ml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ml:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      IMAGE: factorminus
      TAG: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # torch и веса laya занимают несколько гигабайт: освобождаем место на раннере
      - name: free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.35.1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
      - name: build runtime-ml
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime-ml
          load: true
          tags: factorminus:ci-ml
          cache-from: type=gha,scope=runtime-ml
          cache-to: type=gha,mode=max,scope=runtime-ml
      # ленивый Router() и, раз памяти на раннере хватает, preload=True (ml_heavy)
      - run: mkdir -p build && make docker-test-ml ML_PYTEST_ARGS=--ml-heavy 2>&1 | tee build/ml.log
      - name: summary
        if: always()
        run: |
          {
            echo "## ML smoke"
            echo
            echo "Размер runtime-ml: $(( $(docker image inspect -f '{{.Size}}' factorminus:ci-ml) / 1024 / 1024 )) МБ"
            grep -E 'passed|failed' build/ml.log | tail -1
            grep 'Пиковая память' build/ml.log || true
          } >> "$GITHUB_STEP_SUMMARY"
